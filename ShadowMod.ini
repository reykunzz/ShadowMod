; ShadowMod config - GTA SA Android 2.00
; Ubah nilai lalu restart game.
[Shadow]
Enabled=1
; Resolusi texture shadow real-time: 256 / 512 / 1024 (makin besar makin berat)
Resolution=512
; 1.0 = bawaan game, lebih dari 1.0 = bayangan lebih gelap
StrengthScale=1.30
; Jarak maksimum bayangan ped
PedShadowDistance=40.0
